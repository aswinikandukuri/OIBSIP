
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures easily</p>

        <div class="converter-box">

            <label for="temperature">Enter Temperature</label>
            <input type="number" id="temperature" placeholder="Enter value">

            <label for="fromUnit">From</label>
            <select id="fromUnit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <label for="toUnit">To</label>
            <select id="toUnit">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button onclick="convertTemperature()">Convert</button>
            <button class="clear-btn" onclick="clearFields()">Clear</button>

            <div class="result-box">
                <h3>Result</h3>
                <p id="result">Your result will appear here</p>
            </div>

        </div>

        <footer>
            <p>Temperature Converter | Created with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
